[package]
name = "dm-sqlx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Optional sqlx-core 0.8 driver for Dameng DM8. Enable the `sqlx` feature."

[features]
default = []
# 默认构建不拉 sqlx-core。`cargo build --workspace` 只编译空壳。
sqlx = [
    "dep:dm-conn",
    "dep:dm-proto",
    "dep:sqlx-core",
    "dep:chrono",
    "dep:futures-core",
    "dep:futures-util",
    "dep:log",
    "dep:tracing",
]

[dependencies]
dm-conn = { path = "../dm-conn", optional = true }
dm-proto = { path = "../dm-proto", optional = true }
sqlx-core = { version = "=0.8.6", default-features = false, features = ["_rt-tokio"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
futures-core = { version = "0.3", default-features = false, features = ["alloc"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
log = { version = "0.4", optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
