[workspace]
resolver = "2"
members = ["crates/dm-proto", "crates/dm-conn", "crates/dm-pool", "crates/dm-sqlx"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
bytes = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tracing = "0.1"
