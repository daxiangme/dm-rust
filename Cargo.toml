[package]
name = "dm-rust"
version = "0.1.0"
edition = "2021"
description = "Async Tokio driver for Dameng DM8: wire protocol, connections, optional pool, and optional sqlx-core 0.8"
license = "Apache-2.0"
repository = "https://github.com/daxiangme/dm-rust"
homepage = "https://github.com/daxiangme/dm-rust"
readme = "README.md"
keywords = ["dameng", "dm8", "database", "driver"]
categories = ["database", "asynchronous"]
exclude = ["tests/tls/", "tests/fixtures/", "*.pem", "*.key", "target/"]

[lib]
name = "dm_rust"
path = "src/lib.rs"

[features]
default = ["tls"]
tls = ["dep:tokio-rustls", "dep:rustls", "dep:rustls-pemfile", "dep:rustls-native-certs"]
# No dependencies beyond the connection layer.
pool = []
# sqlx-core 0.8 driver. chrono and tracing stay required: the connection layer always uses them.
sqlx = [
    "dep:sqlx-core",
    "dep:futures-core",
    "dep:futures-util",
    "dep:log",
]

[dependencies]
bytes = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tracing = "0.1"
num-bigint = "0.4"
num-traits = "0.2"
rand = "0.8"
des = "0.8"
aes = "0.8"
cipher = "0.4"
md-5 = "0.10"
crc32fast = "1"
flate2 = "1"
snap = "1"
encoding_rs = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-pemfile = { version = "2", optional = true }
rustls-native-certs = { version = "0.8", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
sqlx-core = { version = "=0.8.6", default-features = false, features = ["_rt-tokio"], optional = true }
futures-core = { version = "0.3", default-features = false, features = ["alloc"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
log = { version = "0.4", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[test]]
name = "pool"
path = "tests/pool.rs"
required-features = ["pool"]

[[test]]
name = "sqlx"
path = "tests/sqlx.rs"
required-features = ["sqlx"]

[[example]]
name = "pool"
path = "examples/pool.rs"
required-features = ["pool"]
